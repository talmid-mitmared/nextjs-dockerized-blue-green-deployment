services:
  proxy:
    image: nginx:1.28-alpine
    container_name: reverse-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - blue-web
      - green-web
    networks:
      - myapp-network
    restart: unless-stopped

  blue-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myapp-blue
    expose:
      - "8081:8080"
    networks:
      - myapp-network
    restart: unless-stopped

  green-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myapp-green
    expose:
      - "8082:8080"
    networks:
      - myapp-network
    restart: unless-stopped

networks:
  myapp-network:
    driver: bridge