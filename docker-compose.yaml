services:
  proxy:
    image: nginx:1.28-alpine
    container_name: reverse-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - blue-web
      - green-web
    networks:
      - myapp-network
    restart: unless-stopped

  blue-web:
    image: ${BLUE_IMAGE:-resetmerlin/myapp-web:latest}
    platform: linux/amd64
    container_name: myapp-blue
    expose:
      - "8080"
    networks:
      - myapp-network
    restart: unless-stopped

  green-web:
    image: ${GREEN_IMAGE:-resetmerlin/myapp-web:latest}
    platform: linux/amd64
    container_name: myapp-green
    expose:
      - "8080"
    networks:
      - myapp-network
    restart: unless-stopped

networks:
  myapp-network:
    driver: bridge