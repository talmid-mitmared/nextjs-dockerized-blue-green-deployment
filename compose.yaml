services:
  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 80:80

  blue-web:
    build:
      context: .
    ports:
      - 8081:8080
      
  green-web:
    build:
      context: .
    ports:
      - 8082:8080
